# Experiments Configuration

reproducibility:
  random_seed: 42
  train_test_split_ratio: 0.20
  stratified: true

dataset:
  num_synthetic_transactions: 10000
  fraud_ratio: 0.05
  num_customers: 500
  num_merchants: 50

models:
  candidate_models:
    - logistic_regression
    - decision_tree
    - random_forest
    - xgboost
    - isolation_forest
  primary_supervised: xgboost
  primary_anomaly: isolation_forest

metrics_to_export:
  - accuracy
  - precision
  - recall
  - f1_score
  - roc_auc
  - confusion_matrix
  - false_positive_rate
  - false_negative_rate
  - inference_latency_ms
  - throughput_tps
